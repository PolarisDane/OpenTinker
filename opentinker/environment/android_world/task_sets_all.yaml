# ============================================================================
# Android World — Complete Task Set Configuration  (116 tasks)
# ============================================================================
# All tasks from android_world.registry (91 Android + 25 Information Retrieval),
# organised as test_ood and grouped by app category and difficulty.
#
# Difficulty levels:
#   easy   — Single-step or straightforward operations (create, toggle, open).
#   medium — Multi-step workflows, verification tasks, relative-date logic,
#            delete-with-constraints, or moderate cross-app interaction.
#   hard   — Cross-app data transfer, image/video processing, duplicate
#            detection with noise, or composite multi-app tasks.
#
# The train / test_id splits are kept empty so that ALL tasks appear only in
# test_ood for comprehensive evaluation.
# ============================================================================


# ---------------------------------------------------------------------------
# Training Tasks  (empty — this config is for full evaluation only)
# ---------------------------------------------------------------------------
train:
  tasks: []


# ---------------------------------------------------------------------------
# In-Distribution Test  (empty — not used in this config)
# ---------------------------------------------------------------------------
test_id:
  use_train_tasks: true
  tasks: []


