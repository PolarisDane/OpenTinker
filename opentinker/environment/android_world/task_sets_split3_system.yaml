# ============================================================================
# Split 3 — System Toggle → Verify & Composite
# ============================================================================
# Strategy: Train on simple System toggle actions (turn on/off wifi,
#           bluetooth, brightness). Test whether the agent can transfer to
#           verification variants (check state after toggle) and multi-step
#           composite tasks.
#
# Train (10): System toggles + OpenApp + CopyToClipboard
# test_id:    Same 10 tasks, fresh random params
# test_ood:   6 verify tasks + 2 composite tasks
# ============================================================================

train:
  tasks:
    # --- easy toggles ---
    - OpenAppTaskEval
    - SystemBluetoothTurnOff
    - SystemBluetoothTurnOn
    - SystemBrightnessMax
    - SystemBrightnessMin
    - SystemCopyToClipboard
    - SystemWifiTurnOff
    - SystemWifiTurnOn

test_id:
  use_train_tasks: true
  tasks: []

test_ood:
  tasks:
    # Verify variants — same toggle + verify the state changed
    # (requires reading system state after action)
    - SystemBluetoothTurnOffVerify
    - SystemBluetoothTurnOnVerify
    - SystemBrightnessMaxVerify
    - SystemBrightnessMinVerify
    - SystemWifiTurnOffVerify
    - SystemWifiTurnOnVerify
    # Composite — chain two system actions together
    - TurnOffWifiAndTurnOnBluetooth
    - TurnOnWifiAndOpenApp

eval_settings:
  n_instances_per_task: 1
  max_steps: 15
  seed: 42
